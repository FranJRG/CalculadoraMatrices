<h1 align="center">PROBLEMAS MATRICIALES</h1>
<form style="margin-left: 460px; width: 810px;"  id="problemaMatriz" class="calculator">
    <small style="font-weight: bold;">- Introduzca el sistema de ecuaciones en formato matriz</small>
    <div style="padding-left:17px ;">
        <input type="text" readonly value="x"> <input type="text" readonly value="y"> <input type="text" readonly value="z"><br>
        <br><input type="number" id="a" placeholder="Valor 1,1">
        <input type="number" step="0.001" id="b" placeholder="Valor 1,2">
        <input type="number" step="0.001" id="c" placeholder="Valor 1,3">
        <input type="number" step="0.001" id="result1" placeholder="Resultado sistema">
        <br><input type="number" step="0.001" id= "d" placeholder="Valor 2,1">
        <input type="number" step="0.001" id="e" placeholder="Valor 2,2">
        <input type="number" step="0.001" id="f" placeholder="Valor 2,3">
        <input type="number" step="0.001" id="result2" placeholder="Resultado sistema">
        <br><input type="number" step="0.001" id= "g" placeholder="Valor 3,1">
        <input type="number" step="0.001" id="h" placeholder="Valor 3,2">
        <input type="number" step="0.001" id="i" placeholder="Valor 3,3">
        <input type="number" step="0.001" id="result3" placeholder="Resultado sistema"><br> 
        <br>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <button id="problem" type="submit" class="btn btn-success">Resolver Problema</button>
    </div>
    <br>
    <br>
    <p>Paso 1: <span id="paso1"></span></p>
    <p>Paso 2: <span id="paso2"></span></p>
    <p>Paso 3: <span id="paso3"></span></p>
    <p>El resultado de la matriz determinantes es : <span id="result"></span></p>
    <p><span id="resultInv"></span></p>
    <p><span id="resultSystem"></span></p>
</form>
